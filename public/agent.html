<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Agent Portal | Online उन्नति</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .agent-container {
            padding: 120px 0;
            display: flex;
            justify-content: center;
        }

        .agent-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 600px;
            width: 100%;
        }

        .header-group {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-group h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header-group p {
            color: var(--text-muted);
        }
    </style>
</head>

<body class="dark-theme">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Online<span>उन्नति</span> Agent</a>
            <div class="admin-user"><i class="fas fa-user-tie"></i> Agent Mode</div>
        </div>
    </nav>

    <div class="agent-container container">
        <div class="agent-card glass">
            <div class="header-group">
                <h1>Register New Business</h1>
                <p>Enter complete business details to help local shops grow.</p>
            </div>
            <form id="businessForm">
                <div class="form-group">
                    <label>Employee Code</label>
                    <input type="text" name="empCode" required placeholder="Enter your unique code (e.g. UNXXXXX)">
                </div>
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" name="bizName" required placeholder="Shop/Business Name">
                </div>
                <div class="form-group">
                    <label>Owner Name</label>
                    <input type="text" name="ownerName" required placeholder="Owner Identity Name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="bizPhone" required placeholder="WhatsApp Number preferred">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="bizAddress"
                        style="width:100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color:white;"
                        rows="3" placeholder="Full address with landmark"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Business Details</button>
            </form>
            <div id="statusMessage" style="margin-top: 20px; text-align: center; display: none;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/agent.js?v=1"></script>
</body>

</html>
